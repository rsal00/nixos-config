# ~/.config/hypr/hyprland.conf

# Monitor configuration
monitor = HDMI-A-1, 1920x1080@60, 1920x0, 1
monitor = HDMI-A-3, 1920x1080@60, 0x0, 1
monitor = eDP-1, 1920x1080@60, 1920x1080, 1

# Autostart
exec-once = waybar &
exec-once = dunst &
exec-once = hyprpaper &

# Keybindings
$mainMod = SUPER
$subMod = SUPER SHIFT
$terminal = kitty

bind = $mainMod, Z, exec, $terminal
bind = $mainMod, Q, killactive
bind = $subMod, X, exit

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9

# Move windows to workspaces
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Resize active window with SUPER + SHIFT and arrow keys
bind = $subMod, right, resizeactive, 20 0
bind = $subMod, left, resizeactive, -20 0
bind = $subMod, up, resizeactive, 0 -20
bind = $subMod, down, resizeactive, 0 20

# Switch positions of two windows in the same workspace
bind = $subMod, h, swapwindow, l
bind = $subMod, j, swapwindow, d
bind = $subMod, k, swapwindow, u
bind = $subMod, l, swapwindow, r

##-- Adjust audio volume

bind = $mainMod, V, exec, pavucontrol

# Raise volume by 5%
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+

# Lower volume by 5%
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

# Mute/Unmute audio
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Audio pause/forward/backward
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop

##--

#-- Move window to special workplace

bind = $mainMod, H, movetoworkspacesilent, special

# toggle special workspace
bind = $mainMod, G, togglespecialworkspace, special

#--

# Rofi
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, S, exec, rofi -show run 
bind = $mainMod, F, exec, rofi -show filebrowser

# wlogout
bind = $mainMod, X, exec, wlogout

# Input
input {
    kb_layout = us
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
    }
}

# General settings
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33ccffee)
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
}

decoration {
    rounding = 5
}
